











































<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STON Messenger</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial}
header{padding:18px;text-align:center;background:#181818;font-size:22px;font-weight:bold}
#nameBox{padding:10px;background:#181818}
#name{width:100%;padding:12px;border:0;border-radius:10px}
#usersBox{padding:10px;background:#202020}
#users{display:flex;gap:8px;overflow:auto;margin-top:8px}
.user{padding:9px 14px;border:0;border-radius:10px;background:#333;color:#fff;white-space:nowrap}
#selected{padding:10px;text-align:center;background:#181818}
#messages{height:calc(100vh - 330px);overflow:auto;padding:12px}
.msg{display:flex;margin:7px 0}
.bubble{padding:10px 13px;border-radius:15px;max-width:75%;word-wrap:break-word}
.mine{justify-content:flex-start}
.mine .bubble{background:#00a884;border-bottom-left-radius:4px}
.theirs{justify-content:flex-end}
.theirs .bubble{background:#292929;border-bottom-right-radius:4px}
.msgname{font-size:11px;opacity:.7;margin-bottom:3px}
.msgimg{max-width:230px;border-radius:12px;display:block;margin-top:5px}
form{position:fixed;bottom:0;left:0;right:0;background:#181818;padding:10px;display:flex;gap:8px}
#input{flex:1;padding:13px;border:0;border-radius:10px;font-size:16px}
button{padding:10px 18px;border:0;border-radius:10px;background:#00a884;color:#fff;font-weight:bold}
#photo{display:none}
.photoBtn{padding:10px 14px;background:#444;border-radius:10px;cursor:pointer}
</style>
</head>
<body>

<header>STON Messenger</header>

<div id="nameBox">
<input id="name" placeholder="اكتب اسمك..." autocomplete="off">
</div>

<div id="usersBox">
<b>المستخدمون المتصلون:</b>
<div id="users"></div>
</div>

<div id="selected">اختر مستخدمًا</div>
<div id="messages"></div>

<form id="form">
<label for="photo" class="photoBtn">🖼️</label>
<input id="photo" type="file" accept="image/*">
<input id="input" placeholder="اكتب رسالة..." autocomplete="off">
<button type="submit">إرسال</button>
</form>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();

const form=document.getElementById("form");
const input=document.getElementById("input");
const nameInput=document.getElementById("name");
const usersBox=document.getElementById("users");
const messages=document.getElementById("messages");
const selected=document.getElementById("selected");
const photo=document.getElementById("photo");

let selectedUser=null;

const savedName=localStorage.getItem("ston_name");
if(savedName) nameInput.value=savedName;

function join(){
  const username=nameInput.value.trim()||"مستخدم";
  localStorage.setItem("ston_name",username);
  socket.emit("join",username);
}

socket.on("connect",join);

nameInput.addEventListener("change",join);

socket.on("users",list=>{
  usersBox.innerHTML="";

  list.forEach(user=>{
    if(user.id===socket.id)return;

    const b=document.createElement("button");
    b.className="user";
    b.textContent=user.name;

    b.onclick=()=>{
      selectedUser=user.id;
      selected.textContent="المحادثة مع: "+user.name;
      messages.innerHTML="";
    };

    usersBox.appendChild(b);
  });
});

form.addEventListener("submit",e=>{
  e.preventDefault();

  const text=input.value.trim();
  if(!text)return;

  if(!selectedUser){
    alert("اختر مستخدمًا أولًا");
    return;
  }

  socket.emit("private message",{
    to:selectedUser,
    text:text
  });

  input.value="";
});

photo.addEventListener("change",()=>{
  const file=photo.files[0];

  if(!file)return;

  if(!selectedUser){
    alert("اختر مستخدمًا أولًا");
    photo.value="";
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{
    socket.emit("private image",{
      to:selectedUser,
      image:reader.result
    });
  };

  reader.readAsDataURL(file);
  photo.value="";
});

function showMessage(data,isImage=false){
  const row=document.createElement("div");
  const bubble=document.createElement("div");
  const who=document.createElement("div");

  row.className="msg "+(data.from===socket.id?"mine":"theirs");
  bubble.className="bubble";
  who.className="msgname";
  who.textContent=data.name;

  bubble.appendChild(who);

  if(isImage){
    const img=document.createElement("img");
    img.src=data.image;
    img.className="msgimg";
    bubble.appendChild(img);
  }else{
    bubble.appendChild(document.createTextNode(data.text));
  }

  row.appendChild(bubble);
  messages.appendChild(row);
  messages.scrollTop=messages.scrollHeight;
}

socket.on("private message",data=>{
  showMessage(data,false);
});

socket.on("private image",data=>{
  showMessage(data,true);
});
</script>

</body>
</html>
