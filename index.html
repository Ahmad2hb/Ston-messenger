<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STON Messenger</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
header{padding:18px;text-align:center;background:#181818;font-size:22px;font-weight:bold}
#messages{height:calc(100vh - 190px);overflow:auto;padding:15px}
.msg{background:#252525;padding:12px;margin:8px 0;border-radius:12px}
#nameBox{display:flex;padding:10px;background:#181818;gap:8px}
#name{flex:1;padding:12px;border:0;border-radius:10px}
form{position:fixed;bottom:0;left:0;right:0;background:#181818;padding:10px;display:flex;gap:8px}
input{flex:1;padding:13px;border:0;border-radius:10px;font-size:16px}
button{padding:0 20px;border:0;border-radius:10px;background:#00a884;color:#fff;font-weight:bold}
</style>
</head>
<body>

<header>STON Messenger</header>

<div id="nameBox">
<input id="name" placeholder="اكتب اسمك..." autocomplete="off">
</div>

<div id="messages"></div>

<form id="form">
<input id="input" placeholder="اكتب رسالة..." autocomplete="off">
<button type="submit">إرسال</button>
</form>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const form = document.getElementById("form");
const input = document.getElementById("input");
const name = document.getElementById("name");
const messages = document.getElementById("messages");

const savedName = localStorage.getItem("ston_name");
if (savedName) name.value = savedName;

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const msg = input.value.trim();
  const username = name.value.trim() || "مستخدم";

  if (!msg) return;

  localStorage.setItem("ston_name", username);

  socket.emit("chat message", {
    name: username,
    text: msg
  });

  input.value = "";
});

socket.on("chat message", function(data) {
  const div = document.createElement("div");
  div.className = "msg";
  div.textContent = data.name + ": " + data.text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});
</script>

</body>
</html>
