<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STON Messenger</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:white}
header{padding:18px;background:#181818;text-align:center;font-size:22px;font-weight:bold}
#messages{height:calc(100vh - 130px);overflow-y:auto;padding:15px;box-sizing:border-box}
.message{background:#252525;padding:10px 14px;margin:8px 0;border-radius:14px;max-width:75%;word-wrap:break-word}
form{position:fixed;bottom:0;left:0;right:0;display:flex;padding:10px;background:#181818;gap:8px}
input{flex:1;padding:13px;border:0;border-radius:12px;font-size:16px}
button{padding:0 20px;border:0;border-radius:12px;background:#00a884;color:white;font-weight:bold}
</style>
</head>
<body>

<header>STON Messenger</header>

<div id="messages"></div>

<form id="form">
<input id="input" placeholder="اكتب رسالة..." autocomplete="off">
<button>إرسال</button>
</form>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const form = document.getElementById( form );
const input = document.getElementById( input );
const messages = document.getElementById( messages );

form.addEventListener( submit , e => {
  e.preventDefault();
  if(input.value.trim()){
    socket.emit( chat message , input.value);
    input.value =   ;
  }
});

socket.on( chat message , msg => {
  const div = document.createElement( div );
  div.className =  message ;
  div.textContent = msg;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});
</script>

</body>
</html>
